# B0 必做：PatchCore 基线（手册第 3、5 页）
# 用法：py run.py --config configs/b0_patchcore.yaml --dataset mvtec_ad --category bottle
run_tag: B0
method: patchcore
backbone: resnet18
layers: [layer2, layer3]
image_size: 256

# 实验参数（命令行可覆盖）
seed: 17
n: 100
batch_size: 8
workers: 2

patchcore:
  coreset_ratio: 0.05
  num_neighbors: 9
  sampling: coreset   # C1 对照实验改为 random（等数量随机采样）
  sampling_seed: 0
